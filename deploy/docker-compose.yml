# Produktiv-Stack für den VPS: Caddy (TLS) → WordPress (Apache) → MariaDB.
# Nutzung: siehe README, Abschnitt „Deployment auf einen VPS“.
name: ecommerce-expert-prod

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD setzen}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD setzen}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'production' );
        define( 'WP_HOME', 'https://${SITE_DOMAIN}' );
        define( 'WP_SITEURL', 'https://${SITE_DOMAIN}' );
        define( 'DISALLOW_FILE_EDIT', true );
        define( 'AUTOMATIC_UPDATER_DISABLED', false );
        if ( isset( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) && 'https' === $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) {
          $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wordpress:/var/www/html
      # Das versionierte Theme wird aus dem Git-Checkout eingehängt (read-only: Änderungen laufen über Git).
      - ../theme/ecommerce-expert:/var/www/html/wp-content/themes/ecommerce-expert:ro
      - ../backups:/backups
    expose:
      - "80"

  wpcli:
    image: wordpress:cli
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      HOME: /tmp
    volumes:
      - wordpress:/var/www/html
      - ../theme/ecommerce-expert:/var/www/html/wp-content/themes/ecommerce-expert:ro
      - ../scripts/wp:/scripts/wp:ro
      - ../backups:/backups

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN setzen, z. B. ecommerce-expert.de}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL setzen}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  wordpress:
  caddy_data:
  caddy_config:
